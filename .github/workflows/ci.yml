name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # M1 is pure Go, so the matrix is about proving portability rather than
    # about cgo. Live capture (M2) will need libpcap headers per platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # The sample capture is generated, not recorded. If it drifts from the
  # generator, the end-to-end tests are asserting against a stale artefact.
  testdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The generator mints fresh RSA keys each run, so the bytes are not
      # byte-reproducible. What must hold is that a capture rebuilt from the
      # current generator still yields the inventory the tests assert.
      - name: regenerated capture still matches the end-to-end expectations
        run: |
          go run ./testdata/gen
          go test ./internal/assemble/

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # A smoke run only. Sustained fuzzing belongs in OSS-Fuzz; this is
      # here so a PR that introduces an obvious crasher fails in review.
      - run: go test ./internal/tlsparse -run=Fuzz -fuzz=FuzzParseStream -fuzztime=120s

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every release target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "-> $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/tlscensus
          done
